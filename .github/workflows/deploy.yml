name: Deploy website to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions". After that this runs automatically on every push.

on:
  push:
    branches:
      - main
      - claude/elixar-renewables-3d-w410pb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # Repo is served at https://<owner>.github.io/Elixa-Website-/
          NEXT_PUBLIC_BASE_PATH: /Elixa-Website-
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
