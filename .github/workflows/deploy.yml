name: Deploy website to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions". After that this runs automatically on every push.

on:
  push:
    branches:
      # Only this branch. The github-pages environment is configured to
      # accept deployments from it alone, so a run started by a push to
      # main can never reach the deploy step — but it DOES grab the
      # shared "pages" concurrency group and cancel the run that can.
      # Merging a PR would therefore kill the deploy the branch push had
      # already started. Add main back here only if main is also added
      # under Settings -> Environments -> github-pages -> Deployment
      # branches.
      - claude/elixar-renewables-3d-w410pb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # Served at the root of elixarenewables.co.uk (see public/CNAME),
          # so no base path. The old github.io/Elixa-Website-/ address
          # redirects here. Only ever set this back to the sub-path if the
          # domain stops pointing at GitHub, or the site loads unstyled.
          NEXT_PUBLIC_BASE_PATH: ""
          # Optional hosted plan-recognition relay (workers/plan-api). Unset →
          # the in-browser extractor is the only path; set the repo variable
          # to the deployed Worker URL to switch the API on.
          NEXT_PUBLIC_PLAN_API_URL: ${{ vars.NEXT_PUBLIC_PLAN_API_URL }}
          # Lead/enquiry inbox (e.g. a Formspree form URL). Unset → the quote
          # form falls back to opening the visitor's email client; set the
          # repo variable to activate real submissions with the floor-plan
          # attachment riding along.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          # Web3Forms access key — the simplest route: set this repo variable
          # and enquiries (with attachments, on their Pro plan) are emailed
          # straight to the inbox the key was created for. Takes effect on
          # the next deploy; no code changes needed.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
