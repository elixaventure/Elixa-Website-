name: Deploy website to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions". After that this runs automatically on every push.

on:
  push:
    branches:
      # Only this branch. The github-pages environment is configured to
      # accept deployments from it alone, so a run started by a push to
      # main can never reach the deploy step — but it DOES grab the
      # shared "pages" concurrency group and cancel the run that can.
      # Merging a PR would therefore kill the deploy the branch push had
      # already started. Add main back here only if main is also added
      # under Settings -> Environments -> github-pages -> Deployment
      # branches.
      - claude/elixar-renewables-3d-w410pb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the enquiry inbox is wired up
        env:
          KEY_VAR: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          KEY_SECRET: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
          ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT || secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
          TF_URL: ${{ vars.NEXT_PUBLIC_TASKFLOW_LEAD_URL || secrets.NEXT_PUBLIC_TASKFLOW_LEAD_URL }}
          TF_KEY: ${{ vars.NEXT_PUBLIC_TASKFLOW_SITE_KEY || secrets.NEXT_PUBLIC_TASKFLOW_SITE_KEY }}
        run: |
          # Presence and length only — never the value. A static export bakes
          # these in at build time, so a key that never reaches the build
          # silently ships a quote form that falls back to opening the
          # visitor's own email app. Reported to the run summary as well as
          # the log, so it is readable without opening the job.
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -n "$(echo "$KEY_VAR" | tr -d '[:space:]')" ]; then
            say "Web3Forms key: SET as a repository Variable (${#KEY_VAR} characters)"
          elif [ -n "$(echo "$KEY_SECRET" | tr -d '[:space:]')" ]; then
            say "Web3Forms key: SET as a repository Secret (${#KEY_SECRET} characters)"
          else
            say "Web3Forms key: NOT SET -- enquiries will open the visitor's email app"
          fi
          if [ -n "$(echo "$ENDPOINT" | tr -d '[:space:]')" ]; then
            say "Custom form endpoint: SET"
          else
            say "Custom form endpoint: not set"
          fi
          # Both halves, named separately: a URL with no key is rejected by
          # the function with a 403 that looks from the outside exactly like
          # nothing happening at all.
          if [ -n "$(echo "$TF_URL" | tr -d '[:space:]')" ] && [ -n "$(echo "$TF_KEY" | tr -d '[:space:]')" ]; then
            say "TaskFlow leads: SET -- enquiries also post to the app"
          elif [ -n "$(echo "$TF_URL" | tr -d '[:space:]')" ]; then
            say "TaskFlow leads: URL set but SITE KEY MISSING -- the app will reject every enquiry"
          elif [ -n "$(echo "$TF_KEY" | tr -d '[:space:]')" ]; then
            say "TaskFlow leads: site key set but URL MISSING -- nothing will be posted to the app"
          else
            say "TaskFlow leads: not set -- enquiries go to the inbox only"
          fi
      - name: Build static export
        run: npm run build
        env:
          # Served at the root of elixarenewables.co.uk (see public/CNAME),
          # so no base path. The old github.io/Elixa-Website-/ address
          # redirects here. Only ever set this back to the sub-path if the
          # domain stops pointing at GitHub, or the site loads unstyled.
          NEXT_PUBLIC_BASE_PATH: ""
          # Optional hosted plan-recognition relay (workers/plan-api). Unset →
          # the in-browser extractor is the only path; set the repo variable
          # to the deployed Worker URL to switch the API on.
          NEXT_PUBLIC_PLAN_API_URL: ${{ vars.NEXT_PUBLIC_PLAN_API_URL }}
          # Lead/enquiry inbox (e.g. a Formspree form URL). Unset → the quote
          # form falls back to opening the visitor's email client; set the
          # repo variable to activate real submissions with the floor-plan
          # attachment riding along.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT || secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
          # Web3Forms access key — the simplest route: set this repo variable
          # and enquiries (with attachments, on their Pro plan) are emailed
          # straight to the inbox the key was created for. Takes effect on
          # the next deploy; no code changes needed.
          # Read from either tab. A Web3Forms access key is public by
          # design -- it ships in the client bundle and only names the
          # destination inbox -- so accepting it as a Secret costs nothing
          # and saves a support round when it lands on the wrong tab.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY || secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
          # TaskFlow — the installers' app. Set both repo variables and
          # every enquiry also lands in their leads inbox, alongside the
          # email above. A static export bakes these in at build time, so
          # they have to be listed HERE: setting the repository variables
          # on their own does nothing, which is exactly how the first
          # attempt at this silently posted nowhere.
          NEXT_PUBLIC_TASKFLOW_LEAD_URL: ${{ vars.NEXT_PUBLIC_TASKFLOW_LEAD_URL || secrets.NEXT_PUBLIC_TASKFLOW_LEAD_URL }}
          # Public by design, like the Web3Forms key above — it only names
          # a destination — so it is accepted from either tab.
          NEXT_PUBLIC_TASKFLOW_SITE_KEY: ${{ vars.NEXT_PUBLIC_TASKFLOW_SITE_KEY || secrets.NEXT_PUBLIC_TASKFLOW_SITE_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
